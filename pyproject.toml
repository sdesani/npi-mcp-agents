[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "npi-mcp"
version = "0.1.0"
description = "MCP server wrapping the public NPPES NPI Registry API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.9.0,<2",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.scripts]
npi-mcp = "npi_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/npi_mcp"]
